<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal website and blog of Grzegorz Jońca (Greg / DevMonte) - Engineer, Bushcrafter, Mountaineer, Traveller.">
  <title>DevMonte - Grzegorz Jońca</title>

  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" crossorigin="anonymous" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Marked Parser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <!-- Reading Progress Bar -->
  <div id="reading-progress" class="reading-progress-bar"></div>

  <!-- Sticky Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#hero" class="brand-logo">DevMonte</a>
      <div class="nav-actions">
        <a href="#blog" class="nav-link">Blog</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Light/Dark Theme">
          <i class="far fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Landing Hero Section -->
  <section id="hero" class="hero-section">
    <img src="image.png" alt="Grzegorz Jońca profile picture" class="profile-avatar">
    <h1 class="hero-title">
      Hi, my name is Greg and I am <span id="title" class="title-word">engineer</span>.
    </h1>

    <ul class="social-icons">
      <li><a href="https://www.linkedin.com/in/gregjonca/" target="_blank" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a></li>
      <li><a href="https://www.instagram.com/dev.monte/" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a></li>
      <li><a href="https://twitter.com/devgrzegorz" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a></li>
      <li><a href="mailto:greg.jonca@gmail.com" target="_blank" aria-label="Email"><i class="far fa-envelope"></i></a></li>
    </ul>

    <a href="#blog" class="scroll-indicator">
      <span>Read Blog</span>
      <i class="fas fa-chevron-down"></i>
    </a>
  </section>

  <!-- Content & Blog Section -->
  <main id="blog" class="content-wrapper">
    <!-- Posts List View -->
    <section id="posts-list-section">
      <div class="section-header">
        <h2 class="section-title">Blog</h2>
        <p class="section-subtitle">Notes on software engineering, outdoors, and minimalism.</p>
      </div>

      <!-- Search & Tag Filter Bar -->
      <div class="search-filter-wrapper">
        <div class="search-input-box">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="search-input" placeholder="Search posts by keyword, title, or content..." aria-label="Search posts">
          <button id="clear-search-btn" class="clear-search-btn" title="Clear search">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <div id="tag-cloud" class="tag-cloud">
          <!-- Dynamic tags will be injected here -->
        </div>
      </div>

      <!-- Posts Grid -->
      <div id="posts-list" class="posts-list">
        <!-- Dynamically rendered blog posts will appear here -->
      </div>
    </section>

    <!-- Expanded Single Post View -->
    <article id="post-expanded-view" class="post-expanded-view">
      <div class="post-nav-bar">
        <button class="back-to-posts-btn" onclick="closePost()">
          <i class="fas fa-arrow-left"></i> Back to Blog
        </button>

        <div class="post-share-actions">
          <button class="action-icon-btn" onclick="copyArticleLink()" title="Copy article link">
            <i class="fas fa-link"></i>
          </button>
          <button class="action-icon-btn" onclick="shareArticleTwitter()" title="Share on X / Twitter">
            <i class="fab fa-twitter"></i>
          </button>
          <button class="action-icon-btn" onclick="shareArticleLinkedIn()" title="Share on LinkedIn">
            <i class="fab fa-linkedin"></i>
          </button>
        </div>
      </div>

      <!-- Article Table of Contents Container -->
      <div id="article-toc" class="article-toc" style="display: none;"></div>

      <div id="post-content">
        <!-- Rendered markdown content -->
      </div>
    </article>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="toast">Link copied to clipboard!</div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; Grzegorz Jońca (DevMonte). Built with simplicity.</p>
  </footer>

  <!-- Prism Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js" crossorigin="anonymous"></script>

  <!-- App Script -->
  <script src="app.js"></script>
</body>
</html>
